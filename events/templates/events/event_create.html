<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Event</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#050b18,#0c1b2e,#071423);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
            color:white;
        }

        .container{
            width:100%;
            max-width:650px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:28px;
            padding:35px;
            backdrop-filter:blur(12px);
            box-shadow:0 0 40px rgba(0,0,0,0.5);
        }

        .title{
            font-size:32px;
            font-weight:800;
            margin-bottom:10px;
            color:#22c55e;
        }

        .subtitle{
            font-size:14px;
            color:#94a3b8;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:22px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:600;
            color:#e2e8f0;
        }

        .form-control{
            width:100%;
            padding:14px 16px;
            border:none;
            outline:none;
            border-radius:16px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.08);
            color:white;
            font-size:14px;
            transition:0.3s;
        }

        .form-control:focus{
            border:1px solid #22c55e;
            box-shadow:0 0 15px rgba(34,197,94,0.35);
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        select.form-control option{
            background:#0f172a;
            color:white;
        }

        .btn-group{
            display:flex;
            gap:15px;
            margin-top:30px;
        }

        .btn{
            flex:1;
            padding:14px;
            border:none;
            border-radius:16px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
            text-decoration:none;
            text-align:center;
        }

        .btn-save{
            background:#22c55e;
            color:white;
        }

        .btn-save:hover{
            background:#16a34a;
            transform:translateY(-2px);
        }

        .btn-back{
            background:rgba(255,255,255,0.08);
            color:white;
        }

        .btn-back:hover{
            background:rgba(255,255,255,0.15);
        }

        .top-icon{
            font-size:55px;
            margin-bottom:15px;
        }

        @media(max-width:700px){

            .container{
                padding:25px;
            }

            .title{
                font-size:26px;
            }

            .btn-group{
                flex-direction:column;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="top-icon">🏁</div>

        <div class="title">Tambah Event</div>

        <div class="subtitle">
            Tambahkan event lari baru ke dalam sistem RunSnap.
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Nama Event</label>
                <input 
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Contoh: Bandung Marathon 2026"
                >
            </div>

            <div class="form-group">
                <label>Jenis Event</label>

                <select name="event_type" class="form-control">
                    <option value="">-- Pilih Jenis Event --</option>
                    <option value="Marathon">Marathon</option>
                    <option value="Fun Run">Fun Run</option>
                    <option value="Trail Run">Trail Run</option>
                    <option value="Night Run">Night Run</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tanggal Event</label>

                <input 
                    type="date"
                    name="date"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label>Lokasi Event</label>

                <input 
                    type="text"
                    name="location"
                    class="form-control"
                    placeholder="Contoh: Banjar, Jawa Barat"
                >
            </div>

            <div class="btn-group">

                <button type="submit" class="btn btn-save">
                    Simpan Event
                </button>

                <a href="{% url 'event_list' %}" class="btn btn-back">
                    Kembali
                </a>

            </div>

        </form>

    </div>

</body>
</html>
