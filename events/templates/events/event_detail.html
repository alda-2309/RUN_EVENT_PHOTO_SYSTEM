<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Interaktif – Event Lari</title>
<meta name="referrer" content="strict-origin-when-cross-origin">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-editable/1.2.0/Leaflet.Editable.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
    background: linear-gradient(180deg,#4ade80 0%,#16a34a 40%,#14532d 100%);
    background-attachment:fixed;color:white;min-height:100vh;
}
.header{
    background:transparent;padding:20px 40px;
    border-bottom:1px solid rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;
}
.header h1{color:white;font-size:1.4rem;}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;}
.container{width:95%;margin:20px auto;}
.card{
    background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);
    padding:20px;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.15);
}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
#map{height:600px;border-radius:15px;border:1px solid rgba(255,255,255,0.2);z-index:1;}
.panel{
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);
    padding:20px;border-radius:15px;max-height:600px;overflow-y:auto;
}
.panel h2{margin-bottom:15px;color:white;font-size:1.1rem;}
.btn{
    padding:8px 16px;border:none;border-radius:10px;font-weight:600;cursor:pointer;
    transition:.3s;font-size:0.85rem;display:inline-flex;align-items:center;gap:6px;
}
.btn-yellow{background:#fef08a;color:#14532d;}
.btn-yellow:hover{background:#fff59d;box-shadow:0 4px 15px rgba(254,240,138,0.4);}
.btn-danger{background:#ef4444;color:white;}
.btn-danger:hover{background:#dc2626;}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.3);color:white;}
.btn-outline:hover{background:rgba(255,255,255,0.1);}
.btn-sm{padding:5px 10px;font-size:0.75rem;}
.back-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:#fef08a;color:#14532d;padding:10px 18px;border-radius:10px;
    font-weight:600;font-size:0.9rem;transition:.3s;
}
.back-btn:hover{background:#fff59d;box-shadow:0 4px 15px rgba(254,240,138,0.4);}
.point-list{list-style:none;margin-top:10px;}
.point-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;margin-bottom:6px;background:rgba(255,255,255,0.08);
    border-radius:8px;transition:.2s;cursor:grab;
}
.point-item:hover{background:rgba(255,255,255,0.15);}
.point-item.dragging{opacity:0.5;}
.point-item .point-info{display:flex;align-items:center;gap:8px;flex:1;}
.point-item .point-name{font-weight:500;font-size:0.85rem;}
.point-item .point-actions{display:flex;gap:5px;}
.drag-handle{cursor:grab;color:rgba(255,255,255,0.4);font-size:1rem;margin-right:5px;}
.drag-handle:active{cursor:grabbing;}
.empty-state{text-align:center;padding:30px 10px;color:rgba(255,255,255,0.5);font-size:0.9rem;}

.leaflet-container{background:#1a1a2e;}
.checkpoint-marker{
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;background:#ef4444;color:white;
    font-weight:bold;font-size:0.8rem;border:3px solid white;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);cursor:pointer;transition:.2s;
}
.checkpoint-marker:hover{transform:scale(1.15);}

/* Vertex disembunyikan dulu; muncul hanya saat mode edit */
.leaflet-vertex-icon {
    width: 14px !important;
    height: 14px !important;
    margin-left: -7px !important;
    margin-top: -7px !important;
    background: #fbbf24 !important;
    border: 3px solid white !important;
    border-radius: 50% !important;
    cursor: grab !important;
    touch-action: none !important;
    pointer-events: auto !important;
    z-index: 10000 !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
    transition: transform 0.15s ease;
    display: none !important;
}
body.route-editing .leaflet-vertex-icon {
    display: block !important;
}
body.route-editing .leaflet-vertex-icon:hover {
    transform: scale(1.2);
}
body.route-editing .leaflet-vertex-icon:active {
    cursor: grabbing !important;
    transform: scale(1.35);
}

@media(max-width:900px){
    .grid{grid-template-columns:1fr;}
    #map{height:400px;}
    .panel{max-height:400px;}
}
</style>
</head>
<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:15px;">
        <a href="/" class="back-btn">←</a>
        <h1>📍 Peta Interaktif – Atur Route</h1>
    </div>
    <div class="header-actions">
        <button class="btn btn-yellow" onclick="enableAddMode()">➕ Tambah Checkpoint</button>
        <button class="btn btn-outline" onclick="toggleRouteEdit()" id="editRouteBtn">✏️ Edit Route</button>
        <button class="btn btn-outline" onclick="saveAll()">💾 Simpan</button>
        <button class="btn btn-danger" onclick="resetAll()">🗑️ Reset</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="grid">
            <div id="map"></div>
            <div class="panel" id="panel">
                <h2>🏁 Checkpoints</h2>
                <p style="font-size:0.8rem;color:rgba(255,255,255,0.6);margin-bottom:10px;">
                    Drag urutkan. <strong>Seret garis route</strong> saat mode edit aktif.
                </p>
                <div id="routeStatus" style="margin-bottom:10px;font-size:0.8rem;color:#fef08a;"></div>
                <ul class="point-list" id="pointList">
                    <li class="empty-state">Belum ada checkpoint. Klik "Tambah Checkpoint" lalu klik peta.</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
const EVENT_ID = 1;
let map, checkpoints = [], markers = {}, addMode = false, draggedIndex = null, routeEditMode = false, routeGeometry = null;

function initMap(){
    map = L.map('map', {dragging: true, editable: true}).setView([-6.9175,107.6191], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    map.on('click', e => {
        if(!addMode) return;
        const name = prompt('Nama checkpoint:', 'Checkpoint ' + (checkpoints.length + 1));
        if(name) addCheckpointAPI(e.latlng.lat, e.latlng.lng, name);
        addMode = false;
        resetAddBtn();
    });

    if (map.editTools) {
        map.editTools.featuresLayer = new L.FeatureGroup().addTo(map);
    }
}

/* ❗ Fix: geser vertex -> map ikut geser */
function fixVertexDrag(){
    document.addEventListener('mousedown', e => {
        const target = e.target;
        if(target.classList && target.classList.contains('leaflet-vertex-icon')){
            map.dragging.disable();
            const onUp = () => {
                map.dragging.enable();
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mouseup', onUp);
        }
    });
}

function setRouteStatus(text, ok=true){
    const el = document.getElementById('routeStatus');
    if (!el) return;
    el.style.color = ok ? '#fef08a' : '#fca5a5';
    el.textContent = text;
}

async function syncRouteGeometry(){
    if (!routeLine) return true;
    const raw = routeLine.getLatLngs();
    const flat = Array.isArray(raw[0]) ? raw[0] : raw;
    const latlngs = flat.map(ll => ({lat: ll.lat, lng: ll.lng}));
    routeGeometry = latlngs;
    const ok = await saveRouteAPI({event_id: EVENT_ID, points: latlngs});
    setRouteStatus(ok ? '✅ Route tersimpan' : '❌ Route gagal disimpan', ok);
    return ok;
}

async function toggleRouteEdit(){
    const btn = document.getElementById('editRouteBtn');

    if (!routeEditMode) {
        routeEditMode = true;
        document.body.classList.add('route-editing');
        btn.textContent = '✅ Selesai Edit';
        btn.style.background = '#ef4444';
        btn.style.color = 'white';
        renderRoute();
        return;
    }

    // selesai edit -> simpan full geometry, lalu keluar mode edit
    const ok = await syncRouteGeometry();
    if (!ok) return;
    routeEditMode = false;
    document.body.classList.remove('route-editing');
    btn.textContent = '✏️ Edit Route';
    btn.style.background = 'transparent';
    btn.style.color = 'white';
    renderRoute();
    setRouteStatus('✅ Mode edit ditutup');
}

function resetAddBtn(){
    const btn = document.querySelector('.btn-yellow');
    btn.textContent = '➕ Tambah Checkpoint';
    btn.style.background = '#fef08a'; btn.style.color = '#14532d';
}

async function fetchCheckpoints(){
    const resp = await fetch(`/events/api/points/?event_id=${EVENT_ID}`);
    checkpoints = (await resp.json()).points || [];

    const routeResp = await fetch(`/events/api/route/?event_id=${EVENT_ID}`);
    const routeData = await routeResp.json();
    routeGeometry = routeData.route ? routeData.route.points : null;

    renderAll();
}

async function addCheckpointAPI(lat, lng, name){
    const resp = await fetch('/events/api/points/add/', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({event_id:EVENT_ID, lat, lng, name})
    });
    const data = await resp.json();
    if(data.success){ checkpoints.push(data.point); renderAll(); }
    else alert('Gagal: '+(data.error||''));
}

async function updateCheckpointAPI(id, updates){
    return (await fetch(`/events/api/points/${id}/`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(updates)
    })).ok;
}

async function deleteCheckpointAPI(id){
    return (await fetch(`/events/api/points/${id}/delete/`, {method:'DELETE'})).ok;
}

async function saveRouteAPI(payload){
    return (await fetch('/events/api/route/save/', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
    })).ok;
}

// ====================== RENDER ======================
function renderAll(){ renderMarkers(); renderRoute(); renderList(); }

function renderMarkers(){
    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};
    checkpoints.forEach((p, idx) => {
        const icon = L.divIcon({
            className:'',
            html:`<div class="checkpoint-marker">${idx+1}</div>`,
            iconSize:[36,36], iconAnchor:[18,18]
        });
        const m = L.marker([p.lat,p.lng], {icon, draggable:true}).addTo(map);
        m.bindPopup(`<b>${p.name}</b><br><small>(${p.lat.toFixed(5)},${p.lng.toFixed(5)})</small>`);
        m.on('dragend', function(e){
            const pos = e.target.getLatLng();
            p.lat=pos.lat; p.lng=pos.lng;
            updateCheckpointAPI(p.id, {lat:pos.lat, lng:pos.lng});
            renderRoute();
        });
        m.on('click', function(){
            const n = prompt('Edit nama:', p.name);
            if(n && n!==p.name){ p.name=n; updateCheckpointAPI(p.id, {name:n}); renderList(); }
        });
        markers[p.id]=m;
    });
}

let routeLine = null;
function renderRoute(){
    if(routeLine) {
        if (typeof routeLine.disableEdit === 'function') routeLine.disableEdit();
        if (routeLine.editor && typeof routeLine.editor.disable === 'function') routeLine.editor.disable();
        map.removeLayer(routeLine);
    }
    routeLine = null;

    let latlngs = [];
    if (routeGeometry && routeGeometry.length >= 2) {
        latlngs = routeGeometry.map(p => [p.lat, p.lng]);
    } else {
        const sorted = [...checkpoints].sort((a,b)=>a.order-b.order);
        if(sorted.length<2) return;
        latlngs = sorted.map(p=>[p.lat,p.lng]);
    }

    routeLine = L.polyline(latlngs, {color:'#ef4444', weight:5, opacity:0.85}).addTo(map);
    if (routeEditMode) {
        if (typeof routeLine.enableEdit === 'function') routeLine.enableEdit();
        if (routeLine.editor && typeof routeLine.editor.enable === 'function') routeLine.editor.enable();
    }
}

function renderList(){
    const list = document.getElementById('pointList');
    if(!checkpoints.length){
        list.innerHTML = '<li class="empty-state">Belum ada checkpoint. Klik "Tambah Checkpoint" lalu klik peta.</li>';
        return;
    }
    const sorted = [...checkpoints].sort((a,b)=>a.order-b.order);
    list.innerHTML = sorted.map((p,idx)=>`
        <li class="point-item" data-id="${p.id}" draggable="true" data-index="${idx}">
            <div class="point-info">
                <span class="drag-handle">⠿</span>
                <span class="point-name">${idx+1}. ${p.name}</span>
            </div>
            <div class="point-actions">
                <button class="btn btn-sm btn-outline" onclick="editCheckpoint('${p.id}')">✏️</button>
                <button class="btn btn-sm btn-danger" onclick="deleteCheckpoint('${p.id}')">🗑️</button>
            </div>
        </li>
    `).join('');
    // drag-drop
    const items = list.querySelectorAll('.point-item');
    items.forEach(item => {
        item.addEventListener('dragstart', e => {
            draggedIndex = parseInt(e.target.dataset.index);
            e.target.classList.add('dragging');
        });
        item.addEventListener('dragover', e => {
            e.preventDefault();
            const t = e.target.closest('.point-item');
            if(t) t.style.borderBottom = '2px solid #fef08a';
        });
        item.addEventListener('drop', e => {
            e.preventDefault();
            const t = e.target.closest('.point-item');
            if(!t) return;
            t.style.borderBottom = '';
            const ti = parseInt(t.dataset.index);
            if(draggedIndex===null || draggedIndex===ti) return;
            const s = [...checkpoints].sort((a,b)=>a.order-b.order);
            const [moved] = s.splice(draggedIndex,1);
            s.splice(ti,0,moved);
            s.forEach((p,idx)=>{p.order=idx;});
            renderAll();
            draggedIndex=null;
        });
        item.addEventListener('dragend', e => {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.point-item').forEach(el => el.style.borderBottom='');
        });
    });
}

// ====================== ACTIONS ======================
function enableAddMode(){
    addMode = !addMode;
    const btn = document.querySelector('.btn-yellow');
    if(addMode){
        btn.textContent = '❌ Batal';
        btn.style.background = '#ef4444'; btn.style.color = 'white';
    } else resetAddBtn();
}

function editCheckpoint(id){
    const p = checkpoints.find(x=>x.id===id);
    if(!p) return;
    const n = prompt('Edit nama:', p.name);
    if(n && n!==p.name){ p.name=n; updateCheckpointAPI(id,{name:n}); renderList(); }
}

async function deleteCheckpoint(id){
    if(!confirm('Hapus checkpoint ini?')) return;
    if(await deleteCheckpointAPI(id)){
        checkpoints = checkpoints.filter(p=>p.id!==id);
        checkpoints.forEach((p,idx)=>{p.order=idx;});
        renderAll();
    }
}

async function saveAll(){
    if (routeEditMode) {
        await syncRouteGeometry();
    }
    const payload = {
        event_id: EVENT_ID,
        points: routeGeometry || (routeLine ? routeLine.getLatLngs().map(ll => ({lat: ll.lat, lng: ll.lng})) : []),
    };
    alert((await saveRouteAPI(payload)) ? '✅ Route berhasil disimpan!' : '❌ Gagal menyimpan.');
}

async function resetAll(){
    if(!confirm('Hapus SEMUA checkpoint dan route?')) return;
    await fetch('/events/api/points/reset/', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({event_id: EVENT_ID})
    });
    checkpoints = [];
    routeGeometry = null;
    routeEditMode = false;
    document.body.classList.remove('route-editing');
    document.getElementById('editRouteBtn').textContent = '✏️ Edit Route';
    document.getElementById('editRouteBtn').style.background = 'transparent';
    document.getElementById('editRouteBtn').style.color = 'white';
    setRouteStatus('');
    renderAll();
    alert('✅ Semua checkpoint dan route dihapus.');
}

initMap();
fetchCheckpoints();
fixVertexDrag();
</script>

</body>
</html>
