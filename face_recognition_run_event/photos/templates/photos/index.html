<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Foto Lari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .portal-card { background: white; padding: 50px 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; max-width: 650px; width: 90%; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 2.5rem; }
        p { color: #7f8c8d; margin-bottom: 40px; font-size: 1.1rem; }
        .menu-options { display: flex; gap: 25px; justify-content: center; }
        .option-box { 
            flex: 1; padding: 40px 20px; border: 2px solid #ecf0f1; border-radius: 15px; 
            text-decoration: none; color: #333; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
            background-color: #fff;
        }
        /* Efek Hover Ikon BIB (Biru) */
        .option-box.bib:hover { border-color: #3498db; transform: translateY(-8px); box-shadow: 0 10px 20px rgba(52, 152, 219, 0.2); }
        /* Efek Hover Ikon AI (Hijau) */
        .option-box.ai:hover { border-color: #27ae60; transform: translateY(-8px); box-shadow: 0 10px 20px rgba(39, 174, 96, 0.2); }
        
        .icon { font-size: 50px; margin-bottom: 20px; transition: 0.3s; }
        .bib .icon { color: #3498db; }
        .ai .icon { color: #27ae60; }
        
        .title { font-weight: bold; font-size: 20px; color: #2c3e50; }
        .desc { font-size: 13px; color: #95a5a6; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1>Halo, Pelari! 🏃‍♂️</h1>
        <p>Temukan kenangan larimu dengan mudah:</p>
        
        <div class="menu-options">
            <a href="{% url 'search_bib' %}" class="option-box bib">
                <i class="fas fa-id-card icon"></i>
                <span class="title">Nomor BIB</span>
                <span class="desc">Cari berdasarkan nomor dada</span>
            </a>

            <a href="{% url 'test_ai' %}" class="option-box ai">
                <i class="fas fa-face-smile icon"></i>
                <span class="title">Deteksi Wajah</span>
                <span class="desc">Cari dengan AI Selfie</span>
            </a>
        </div>
        
        <!-- <footer style="margin-top: 40px; font-size: 12px; color: #bdc3c7;">
            &copy; 2026 Mutiara Nurazmi - Teknik Informatika
        </footer> -->
    </div>
</body>
</html>
