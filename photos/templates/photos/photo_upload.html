{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Foto</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            background:#f5f5f5;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

            color:#111827;
        }

        .container{

            width:100%;

            max-width:650px;

            background:#ffffff;

            border:1px solid #e5e7eb;

            border-radius:28px;

            padding:35px;

            box-shadow:
            0 4px 15px rgba(0,0,0,.05);
        }

        .icon{

            font-size:60px;

            margin-bottom:15px;
        }

        .title{

            font-size:32px;

            font-weight:800;

            color:#16a34a;

            margin-bottom:10px;
        }

        .subtitle{

            font-size:14px;

            color:#64748b;

            margin-bottom:30px;
        }

        .form-group{

            margin-bottom:22px;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-size:14px;

            font-weight:600;

            color:#374151;
        }

        .form-control{

            width:100%;

            padding:14px 16px;

            outline:none;

            border-radius:16px;

            background:#ffffff;

            border:1px solid #d1d5db;

            color:#111827;

            font-size:14px;
        }

        .form-control:focus{

            border:1px solid #16a34a;

            box-shadow:
            0 0 0 4px rgba(22,163,74,.10);
        }

        input[type="file"]{

            padding:12px;

            cursor:pointer;
        }

        select option{

            background:#ffffff;

            color:#111827;
        }

        .preview{

            margin-top:15px;

            width:100%;

            height:250px;

            border-radius:18px;

            object-fit:cover;

            display:none;
        }

        .btn-group{

            display:flex;

            gap:15px;

            margin-top:30px;
        }

        .btn{

            flex:1;

            padding:14px;

            border:none;

            border-radius:16px;

            font-size:15px;

            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            text-decoration:none;

            text-align:center;
        }

        .btn-upload{

            background:#16a34a;

            color:white;
        }

        .btn-upload:hover{

            background:#15803d;
        }

        .btn-back{

            background:#f3f4f6;

            color:#374151;

            border:1px solid #d1d5db;
        }

        .btn-back:hover{

            background:#e5e7eb;
        }

        .error{

            background:#fee2e2;

            color:#b91c1c;

            padding:14px;

            border-radius:14px;

            margin-bottom:20px;

            font-size:14px;

            font-weight:500;

            border:1px solid #fecaca;
        }

</style>
</head>

<body>

    <div class="container">

        <div class="icon">📤</div>

        <div class="title">Upload Foto Event</div>

        <div class="subtitle">
    Upload dokumentasi foto event lari ke sistem RunSnap.
</div>

{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">

                <label>Pilih Event</label>

                <select name="event" required>

    <option value="">
        -- Pilih Event --
    </option>

    {% for event in events %}

        <option value="{{ event.id }}">
            {{ event.name }}
        </option>

    {% endfor %}

</select>

            </div>

            <div class="form-group">

                <label>Upload Foto</label>

                <input 
                    type="file"
                    name="image"
                    class="form-control"
                    accept="image/*"
                    onchange="previewImage(event)"
                >

                <img id="preview" class="preview">

            </div>

            <div class="btn-group">

                <button type="submit" class="btn btn-upload">
                    Upload Sekarang
                </button>

                <a href="{% url 'photo_list' %}" class="btn btn-back">
                    Kembali
                </a>

            </div>

        </form>

    </div>

    <script>

        function previewImage(event){

            const preview = document.getElementById('preview');

            preview.src = URL.createObjectURL(event.target.files[0]);

            preview.style.display = 'block';
        }

    </script>

</body>
</html>
