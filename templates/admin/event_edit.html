{% extends "admin/base_admin.html" %}
{% block title %}Edit Event - RunSnap Admin{% endblock %}
{% block extra_style %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<style>
    .flatpickr-calendar { font-family: 'Poppins', sans-serif; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover,
    .flatpickr-time input:hover,
    .flatpickr-time input:focus { background: #16a34a; border-color: #16a34a; }
    .flatpickr-day.today { border-color: #fef08a; }
    .flatpickr-time .flatpickr-am-pm:hover { background: #16a34a; }
</style>
{% endblock %}
{% block content %}
<a href="{% url 'admin_event_list' %}" class="back-btn">← Kembali ke Daftar Event</a>
<h1 style="font-size:28px; font-weight:700; margin-bottom:25px; text-align:center;">✏️ Edit Event</h1>

<div class="card" style="max-width:500px; padding:30px; margin:0 auto;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Nama Event</label>
            <input type="text" name="name" class="form-control" value="{{ event.name|default:'' }}" placeholder="Nama event" required style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
        </div>
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Jenis Event</label>
            <select name="event_type" class="form-control" required style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
                <option value="">-- Pilih Jenis Event --</option>
                {% for t in event_types %}
                <option value="{{ t }}" {% if event.event_type == t %}selected{% endif %}>{{ t }}</option>
                {% empty %}
                <option value="Marathon" {% if event.event_type == 'Marathon' %}selected{% endif %}>Marathon</option>
                <option value="Trail Run" {% if event.event_type == 'Trail Run' %}selected{% endif %}>Trail Run</option>
                <option value="Fun Run" {% if event.event_type == 'Fun Run' %}selected{% endif %}>Fun Run</option>
                <option value="Night Run" {% if event.event_type == 'Night Run' %}selected{% endif %}>Night Run</option>
                {% endfor %}
            </select>
            <small style="color:rgba(255,255,255,0.6);">Kelola di <a href="{% url 'admin_event_type_list' %}" style="color:#fef08a;">Jenis Event</a></small>
        </div>
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Timestamp</label>
            <input type="text" name="timestamp" class="form-control datetimepicker" value="{{ event.timestamp|date:'Y-m-d H:i' }}" placeholder="Pilih tanggal & jam" required style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
        </div>
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Lokasi</label>
            <input type="text" name="location" class="form-control" value="{{ event.location|default:'' }}" placeholder="Lokasi event" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
        </div>
        <button type="submit" class="btn btn-yellow" style="padding:10px 24px;">💾 Simpan Perubahan</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script>
    flatpickr('.datetimepicker', {
        enableTime: true,
        dateFormat: 'Y-m-d H:i',
        time_24hr: true,
        allowInput: true,
        locale: { firstDayOfWeek: 1 }
    });
</script>
{% endblock %}
