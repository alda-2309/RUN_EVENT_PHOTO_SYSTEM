{% extends "admin/base_admin.html" %}
{% block title %}Edit Foto - RunSnap Admin{% endblock %}
{% block content %}
<a href="{% url 'admin_photo_list' %}" class="back-btn">← Kembali ke Daftar Foto</a>
<h1 style="font-size:28px; font-weight:700; margin-bottom:25px; text-align:center;">✏️ Edit Foto</h1>

<div class="card" style="max-width:500px; padding:30px; margin:0 auto;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Nama Event</label>
            <input type="text" name="nama_event" class="form-control" value="{{ foto.nama_event|default:'' }}" placeholder="Nama event" required style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; box-sizing:border-box;">
        </div>
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Jenis Event</label>
            <select name="jenis_event" class="form-control" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; box-sizing:border-box;">
                <option value="">-- Pilih --</option>
                <option value="Marathon" {% if foto.jenis_event == 'Marathon' %}selected{% endif %}>Marathon</option>
                <option value="Trail Run" {% if foto.jenis_event == 'Trail Run' %}selected{% endif %}>Trail Run</option>
                <option value="Fun Run" {% if foto.jenis_event == 'Fun Run' %}selected{% endif %}>Fun Run</option>
                <option value="Night Run" {% if foto.jenis_event == 'Night Run' %}selected{% endif %}>Night Run</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Gambar Saat Ini</label>
            {% with foto.image|default:foto.gambar as img_path %}
                {% if img_path %}
                    <div style="width:100%; max-height:300px; border-radius:10px; margin-bottom:12px; background:#14532d; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                        <img src="/media/{{ img_path }}" style="max-width:100%; max-height:300px; object-fit:contain;">
                    </div>
                {% endif %}
            {% endwith %}
            <label style="display:block; margin-bottom:6px; font-weight:600;">Ganti Gambar (opsional)</label>
            <input type="file" name="gambar" class="form-control" accept="image/*" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; box-sizing:border-box;">
        </div>
        <button type="submit" class="btn btn-yellow" style="padding:10px 24px; width:100%; margin-top:10px; box-sizing:border-box;">💾 Simpan Perubahan</button>
    </form>
</div>
{% endblock %}
