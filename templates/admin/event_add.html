{% extends "admin/base_admin.html" %}
{% block title %}Tambah Event - RunSnap{% endblock %}
{% block extra_style %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<style>
    .flatpickr-calendar { font-family: 'Poppins', sans-serif; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover,
    .flatpickr-time input:hover,
    .flatpickr-time input:focus { background: #16a34a; border-color: #16a34a; }
    .flatpickr-day.today { border-color: #fef08a; }
    .flatpickr-time .flatpickr-am-pm:hover { background: #16a34a; }
</style>
{% endblock %}
{% block content %}
<a href="{% url 'admin_dashboard' %}" class="back-btn">← Kembali ke Dashboard</a>
<div class="card" style="max-width:600px; margin:0 auto; padding:30px;">
    <h2 style="text-align:center; margin-bottom:20px; color:#fef08a;">🏁 Tambah Event Baru</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Nama / Jenis Event</label>
            <input type="text" name="event_type" class="form-control" placeholder="Contoh: Bandung Marathon 2026" required>
        </div>
        <div class="form-group">
            <label>Tanggal & Waktu</label>
            <input type="text" name="timestamp" class="form-control datetimepicker" placeholder="Pilih tanggal & jam" required>
        </div>
        <div class="form-group">
            <label>Lokasi</label>
            <input type="text" name="location" class="form-control" placeholder="Contoh: Balai Kota, Bandung" required>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-yellow" style="flex:1;">💾 Simpan Event</button>
            <a href="{% url 'admin_event_list' %}" class="btn btn-ghost" style="flex:1;">Batal</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script>
    flatpickr('.datetimepicker', {
        enableTime: true,
        dateFormat: 'Y-m-d H:i',
        time_24hr: true,
        allowInput: true,
        locale: { firstDayOfWeek: 1 }
    });
</script>
{% endblock %}
